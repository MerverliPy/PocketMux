name: PocketMux iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project PocketMux.xcodeproj

      - name: Show project schemes
        run: |
          xcodebuild -list -project PocketMux.xcodeproj

      - name: Build PocketMux for iPhone Simulator
        id: build_step
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project PocketMux.xcodeproj \
            -scheme PocketMux \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            build 2>&1 | tee xcodebuild.log

      - name: Print first compiler errors
        if: failure()
        shell: bash
        run: |
          echo "===== FIRST 120 error-related lines ====="
          grep -nE "error:|warning:|note:|SSHConnection.swift|Citadel|NIOSSH|SSHHostKeyValidator|executeCommand|authenticationMethod" xcodebuild.log | sed -n '1,120p' || true
          echo
          echo "===== LAST 80 LINES OF BUILD LOG ====="
          tail -n 80 xcodebuild.log || true
