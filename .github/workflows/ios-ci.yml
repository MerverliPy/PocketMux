name: PocketMux iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project PocketMux.xcodeproj

      - name: Show project schemes
        run: |
          xcodebuild -list -project PocketMux.xcodeproj

      - name: Build PocketMux for iPhone Simulator
        run: |
          xcodebuild \
            -project PocketMux.xcodeproj \
            -scheme PocketMux \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            build
